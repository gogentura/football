name: Update results
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run
        run: python3 fetch_results.py
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      - name: Save
        run: |
          git config user.name "results-bot"
          git config user.email "bot@users.noreply.github.com"
          git add results.json
          git diff --staged --quiet || git commit -m "Update results"
          git push
